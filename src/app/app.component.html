<app-nav-bar></app-nav-bar>

<main class="container-lg py-4">
  <header class="page-head">
    <div>
      <h1 class="page-title">India overview</h1>
      <p class="page-sub" *ngIf="summary">
        Data last updated {{ summary.updated | date:'mediumDate' }}
      </p>
    </div>
    <span class="live-dot" *ngIf="status === 'ready'" aria-hidden="true"></span>
  </header>

  <!-- Loading -->
  <div class="stat-grid" *ngIf="status === 'loading'" aria-busy="true">
    <div class="stat-card skeleton" *ngFor="let i of [1,2,3,4]"></div>
  </div>

  <!-- Error -->
  <div class="alert alert-danger d-flex flex-wrap align-items-center gap-3" role="alert" *ngIf="status === 'error'">
    <i class="fa fa-exclamation-circle" aria-hidden="true"></i>
    <span class="flex-grow-1">{{ errorMessage }}</span>
    <button type="button" class="btn btn-sm btn-light" (click)="load(true)">Retry</button>
  </div>

  <!-- Data -->
  <ng-container *ngIf="status === 'ready' && summary">
    <app-stat-cards [totals]="summary.total"></app-stat-cards>

    <section class="panel mt-4">
      <app-chart-js></app-chart-js>
    </section>

    <section class="panel mt-4">
      <app-state-wise [stateData]="stateData"></app-state-wise>
    </section>
  </ng-container>

  <section class="panel mt-4">
    <app-country-wise></app-country-wise>
  </section>

  <section class="panel tips mt-4 text-center">
    <h2 class="h4 mb-1">Stay safe. Save lives.</h2>
    <p class="text-muted-2 mb-3">Simple habits that help stop the spread.</p>
    <ol class="tips-list">
      <li *ngFor="let tip of tips; let i = index">
        <span class="tip-num">{{ i + 1 }}</span>
        <span><strong>{{ tip.key }}</strong> {{ tip.rest }}</span>
      </li>
    </ol>
    <small class="text-muted-2">
      Medical emergency? <i class="fa fa-phone ms-1" aria-hidden="true"></i>
      Call the national helpline <a href="tel:1075">1075</a>.
    </small>
  </section>
</main>

<app-footer></app-footer>
